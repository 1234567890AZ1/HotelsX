# ============================================
# Hotels 酒店系统配置文件
# ============================================
ScriptIrc-config-version: 1

# 插件显示语言：zh_CN（简体中文）/ en_US（English）
# 语言文件位于 plugins/HotelsX/lang/，可自行修改文案
language: zh_CN

# 社区信息（显示在主菜单「帮助」物品的说明里）
community:
  # QQ 群邀请链接，留空则不显示该行
  qq-group: 'https://qm.qq.com/q/Ub0FJXfWSI'

# 每个玩家最大房间数
max-rooms-per-player: 10

# 每个玩家最大合集数
max-collections-per-player: 5

# 房间最大区域大小（方块数）
max-room-volume: 50000

# 是否允许跨世界创建
allow-cross-world: false

# 入住相关
checkin:
  # 入住后自动传送
  auto-teleport: true
  # 最大入住时长（秒），0 表示不限时
  max-stay-seconds: 0
  # 入住成功后的欢迎效果
  welcome-title: true      # 居中大标题"欢迎入住！"
  welcome-actionbar: true  # 底部 ActionBar 提示
  welcome-sound: true      # 播放升级音效

# 经济系统设置
economy:
  # 托管模式：开启后房主收益进入"待提现余额"，需通过 Web 面板或 /ht claim 提现到钱包
  # 关闭则入住时收益实时到账到房主钱包（默认）
  escrow-mode: false

# 时段自动定价（高峰上浮 / 空置打折）
# 房主可在房间管理界面按房间开关自动定价，全局开关在此
auto-pricing:
  # 是否启用自动定价
  enabled: true
  # 高峰时段（24 小时制，含起始不含结束），例如 18 表示 18:00-23:00
  peak-start: 18
  peak-end: 23
  # 高峰时段价格上浮倍数（1.2 = 上浮 20%）
  peak-multiplier: 1.2
  # 周末（周六/周日）价格上浮倍数（1.0 = 不上浮）
  weekend-multiplier: 1.2
  # 房间连续空闲超过 N 天自动打折（0 = 关闭空置打折）
  idle-days: 7
  # 空置折扣比例（0.8 = 八折）
  idle-discount: 0.8
  # 每次自动定价的有效时长（分钟），到期由任务自动刷新
  duration-minutes: 120

# 押金与损坏赔偿
deposit:
  # 默认押金金额（0 = 默认关闭，房主可在房间管理界面为单个房间设置）
  default-amount: 0.0
  # 房间体积超过该值时跳过押金损坏检测（避免大范围方块快照开销）
  max-volume: 20000

# 退房策略
checkout:
  # 全局默认提前退房退款比例（0-100），房主可按房间覆盖
  early-refund-percent: 0

# 预订系统
booking:
  # 是否启用预订功能
  enabled: true
  # 最多可提前预订的天数上限
  max-advance-days: 7
  # 客人预订到点后未到场，保留多少分钟后自动取消并退款
  no-show-minutes: 15

# 店面系统配置（Web 面板商店系统，无游戏内交互）
shop:
  # 是否启用店面系统
  enabled: true
  # 单件商品价格上限
  max-price: 1000000.0
  # 默认补货模式：AUTO（自动从容器补货/收货）/ FIXED（固定库存）
  default-mode: AUTO
  # 每个玩家最多店面数
  max-shops-per-player: 5
  # 店面是否必须挂在房间内
  allow-in-rooms: true
  # 交易消息是否显示（ActionBar 提示）
  transaction-messages: true

# 房间标签预设（管理员配置，房主只能从这里选）
# 一个房间最多 3 个标签
room-tags:
  - 经济房
  - 豪华房
  - 双人房
  - 单人房
  - 观景房
  - 主题房
  - 家庭房
  - 宠物友好

# Web 面板配置
# 启动后可通过浏览器访问 Web 面板查看数据
# Web 面板端口（修改后需执行 /ht web restart）
web-port: 17409
# 绑定地址：默认 127.0.0.1（仅本机可访问，最安全）
# 如需局域网/公网访问，请改为 0.0.0.0，并务必设置强密码！
web-bind: 127.0.0.1
# 是否启用 Web 面板
web-enabled: true

# Web 面板管理员账号
# 首次启动时会自动生成随机密码并保存到此处，请及时登录后修改
# 手动添加格式示例：
# web-admins:
#   - username: admin
#     password: your-strong-password
#     role: superadmin
# 角色说明:
#   user       - 普通用户，只能管理自己名下的房间
#   admin      - 管理员，可修改所有房间，但不能删除房间
#   superadmin - 超级管理员，拥有所有权限（包括删除房间、管理管理员）
# minecraft-name: 关联的游戏内玩家名（user 角色必需，admin 角色可选）
web-admins: []

# 会话超时（分钟）
web-session-timeout: 30

# HTTPS / SSL 配置（可选，默认关闭，保持明文 HTTP 仅本机访问）
# 启用后浏览器访问将使用 https://
# 启用步骤：
#   1) 在 PowerShell 执行以下命令生成自签名证书（有效期 10 年）：
#      openssl req -x509 -newkey rsa:2048 -nodes -keyout key.pem -out cert.pem -days 3650 -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
#      openssl pkcs12 -export -out web-keystore.p12 -inkey key.pem -in cert.pem -passout pass:changeit
#   2) 将 web-keystore.p12 复制到 plugins/HotelsX/ 目录
#   3) 把 web-ssl-enabled 改为 true，必要时调整密码
#   4) 重启服务器或执行 /ht web restart
# 注意：自签名证书浏览器会提示"不安全"，属正常现象；有公网域名建议用 Let's Encrypt 获取受信任证书
web-ssl-enabled: false
web-ssl-keystore: web-keystore.p12
web-ssl-password: changeit
web-ssl-keystore-type: PKCS12

# 铁块电梯设置
elevator:
  # 是否启用电梯功能
  enabled: true
  # 最大搜索距离（方块）
  max-distance: 64

# 房间保护设置
protection:
  # 是否保护房间内方块不被破坏
  block-break-protection: true
  # 是否保护房间内方块不被放置
  block-place-protection: true
  # 是否保护房间内容器不被他人打开
  container-protection: true
  # 是否保护房间不被爆炸破坏
  explosion-protection: true
  # 是否阻止活塞推拉房间内外的方块
  piston-protection: true
  # 是否阻止房间内点火与燃烧
  fire-protection: true
  # 是否保护房间内告示牌内容不被他人改写
  sign-protection: true
  # 是否保护房间内的展示框/盔甲架等实体
  entity-protection: true
  # 门禁系统：房间内的门/活板门/栅栏门只有房主和入住客人可以打开
  door-protection: true
